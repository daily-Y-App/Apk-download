<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Admin Panel - Upload to Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,.3); border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-message { background: #dc2626; color: white; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .success-message { background: #16a34a; color: white; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 40; }
        .modal-backdrop.active { display: flex; align-items: center; justify-content: center; }
        .modal { background: white; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f3f4f6; font-weight: 600; }
        tr:hover { background: #f9fafb; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-blue:hover { background: #2563eb; }
        .btn-red { background: #ef4444; color: white; }
        .btn-red:hover { background: #dc2626; }
        .btn-green { background: #10b981; color: white; }
        .btn-green:hover { background: #059669; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        .form-group textarea { resize: vertical; min-height: 80px; }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">
                <i class="fas fa-film"></i> Movie Admin Panel
            </h1>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-gray-600"></span>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition hidden">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div id="auth-container" class="min-h-[80vh] flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl p-8 max-w-[400px] w-full border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
                <i class="fas fa-lock"></i> Admin Login
            </h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@example.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" />
            </div>
            <div id="auth-message"></div>
            <button id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="main-container" class="hidden max-w-7xl mx-auto px-4 py-8">
        <div id="message-container"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add Movie Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow p-6 border border-gray-100">
                    <h2 class="text-xl font-bold text-gray-800 mb-6">
                        <i class="fas fa-plus-circle"></i> Add New Movie
                    </h2>
                    <form id="add-movie-form">
                        <div class="form-group">
                            <label>Movie Title *</label>
                            <input type="text" id="form-title" placeholder="Enter movie title" required />
                        </div>
                        <div class="form-group">
                            <label>Poster URL *</label>
                            <input type="url" id="form-poster" placeholder="https://example.com/poster.jpg" required />
                        </div>
                        <div class="form-group">
                            <label>Video URL *</label>
                            <input type="url" id="form-url" placeholder="Google Drive or direct link" required />
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="form-description" placeholder="Enter movie description..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                            <i class="fas fa-save"></i> Upload Movie
                        </button>
                    </form>
                </div>
            </div>

            <!-- Movies List -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow p-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-800">
                            <i class="fas fa-list"></i> Movie Store List
                        </h2>
                        <button id="refresh-movies-btn" class="btn-blue btn-sm">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <div id="movies-loading" class="text-center py-8">
                        <div class="loading-spinner mx-auto mb-2"></div>
                        <p class="text-gray-500">Loading movies...</p>
                    </div>
                    <div id="movies-container" class="table-container hidden">
                        <table>
                            <thead>
                                <tr>
                                    <th>Movie</th>
                                    <th>Details</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="movies-list"></tbody>
                        </table>
                    </div>
                    <div id="no-movies" class="text-center py-8 hidden">
                        <i class="fas fa-inbox text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-500">No movies found in store</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal-backdrop" class="modal-backdrop">
        <div class="modal">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-edit"></i> Edit Movie
            </h2>
            <form id="edit-movie-form">
                <input type="hidden" id="edit-doc-id" />
                <div class="form-group">
                    <label>Movie Title</label>
                    <input type="text" id="edit-title" required />
                </div>
                <div class="form-group">
                    <label>Poster URL</label>
                    <input type="url" id="edit-poster" required />
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="url" id="edit-url" required />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="edit-description"></textarea>
                </div>
                <div class="flex gap-4">
                    <button type="submit" class="btn-green btn-sm flex-1">Save Changes</button>
                    <button type="button" class="btn-sm flex-1 bg-gray-500 text-white" onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Config from my-movie-web
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            authDomain: "seafood-oder.firebaseapp.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:8c0ab80a98d241b865c421"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allMovies = [];

        // UI Helpers
        function showMsg(msg, type = 'success') {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="${type}-message">${msg}</div>`;
            setTimeout(() => container.innerHTML = '', 4000);
        }

        // Load Movies
        async function loadMovies() {
            try {
                document.getElementById('movies-loading').classList.remove('hidden');
                document.getElementById('movies-container').classList.add('hidden');
                document.getElementById('no-movies').classList.add('hidden');

                const snap = await getDocs(collection(db, "movies"));
                allMovies = [];
                snap.forEach(d => allMovies.push({ id: d.id, ...d.data() }));
                
                // Field Normalization
                allMovies = allMovies.map(m => {
                    let movie = { id: m.id, title: "", poster: "", url: "", description: "" };
                    Object.keys(m).forEach(k => {
                        const key = k.trim().toLowerCase();
                        if (key === "title") movie.title = m[k];
                        if (key === "poster") movie.poster = m[k];
                        if (key === "url") movie.url = m[k];
                        if (key === "description" || key === "desc") movie.description = m[k];
                    });
                    return movie;
                });

                renderMovies();
                document.getElementById('movies-loading').classList.add('hidden');
                if (allMovies.length === 0) document.getElementById('no-movies').classList.remove('hidden');
                else document.getElementById('movies-container').classList.remove('hidden');
            } catch (e) {
                showMsg(e.message, 'error');
            }
        }

        function renderMovies() {
            const list = document.getElementById('movies-list');
            list.innerHTML = allMovies.map(m => `
                <tr>
                    <td class="flex items-center gap-3">
                        <img src="${m.poster}" class="w-12 h-16 object-cover rounded" onerror="this.src='https://via.placeholder.com/50x75'">
                        <div class="font-bold text-gray-800">${m.title}</div>
                    </td>
                    <td>
                        <div class="text-xs text-gray-500 truncate max-w-[150px]">${m.url}</div>
                        <div class="text-xs text-gray-400 truncate max-w-[150px]">${m.description || 'No description'}</div>
                    </td>
                    <td>
                        <div class="flex gap-2">
                            <button class="btn-blue btn-sm" onclick="editMovie('${m.id}')"><i class="fas fa-edit"></i></button>
                            <button class="btn-red btn-sm" onclick="deleteMovie('${m.id}', '${m.title}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Add Movie
        document.getElementById('add-movie-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const movie = {
                    title: document.getElementById('form-title').value,
                    poster: document.getElementById('form-poster').value,
                    url: document.getElementById('form-url').value,
                    description: document.getElementById('form-description').value,
                    createdAt: new Date().toISOString()
                };
                await addDoc(collection(db, "movies"), movie);
                showMsg('Movie uploaded successfully!');
                document.getElementById('add-movie-form').reset();
                loadMovies();
            } catch (e) { showMsg(e.message, 'error'); }
        });

        // Edit/Delete Functions
        window.editMovie = (id) => {
            const m = allMovies.find(x => x.id === id);
            document.getElementById('edit-doc-id').value = id;
            document.getElementById('edit-title').value = m.title;
            document.getElementById('edit-poster').value = m.poster;
            document.getElementById('edit-url').value = m.url;
            document.getElementById('edit-description').value = m.description;
            document.getElementById('edit-modal-backdrop').classList.add('active');
        };

        window.closeEditModal = () => document.getElementById('edit-modal-backdrop').classList.remove('active');

        document.getElementById('edit-movie-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const id = document.getElementById('edit-doc-id').value;
                await updateDoc(doc(db, "movies", id), {
                    title: document.getElementById('edit-title').value,
                    poster: document.getElementById('edit-poster').value,
                    url: document.getElementById('edit-url').value,
                    description: document.getElementById('edit-description').value
                });
                showMsg('Movie updated!');
                closeEditModal();
                loadMovies();
            } catch (e) { showMsg(e.message, 'error'); }
        });

        window.deleteMovie = async (id, title) => {
            if (confirm(`Delete "${title}"?`)) {
                try {
                    await deleteDoc(doc(db, "movies", id));
                    showMsg('Movie deleted!');
                    loadMovies();
                } catch (e) { showMsg(e.message, 'error'); }
            }
        };

        // Auth
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) { document.getElementById('auth-message').innerHTML = `<div class="error-message">${e.message}</div>`; }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
        document.getElementById('refresh-movies-btn').addEventListener('click', loadMovies);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('main-container').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                document.getElementById('user-email').textContent = user.email;
                loadMovies();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('main-container').classList.add('hidden');
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('user-email').textContent = '';
            }
        });
    </script>
</body>
</html>
