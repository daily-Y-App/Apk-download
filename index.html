        * { margin: 0; padding: 0; box-sizing: border-box; }

            padding: 0 16px;

            top: 0;

        /* Banner Style */
        .banner-container { width: 100%; padding: 10px 16px; }
        .header-banner {
            width: 100%; height: auto; aspect-ratio: 1080/250;
            background: url('https://i.postimg.cc/5NrPGbpS/1771286090163.png') no-repeat center;
            background-size:cover; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Side Menu (မူလအတိုင်း) */
        .side-menu {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: white; z-index: 2005; transition: 0.3s;
            display: flex; flex-direction: column;
        }
        .side-menu.active { left: 0; }
        .menu-header { padding: 20px; border-bottom: 1px solid #eee; }
        .menu-header img { width: 50px; border-radius: 12px; margin-bottom: 8px; }
        .menu-header h2 { font-size: 16px; color: #202124; }

        .menu-item {
            padding: 14px 20px; display: flex; align-items: center; gap: 20px;
            text-decoration: none; color: #3c4043; font-size: 14px;
        }
        .menu-item i { width: 20px; font-size: 18px; color: #5f6368; text-align: center; }
        .menu-divider { height: 1px; background: #eee; margin: 8px 0; }
        .menu-label { padding: 10px 20px; font-size: 11px; color: #70757a; font-weight: bold; text-transform: uppercase; }

        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; z-index: 1500;
        }

        /* App Cards - နမူနာပုံစံအတိုင်း Pink/Purple Gradient */
        .container { max-width: 480px; margin: 0 auto; padding: 16px; }
        .app-card {
            background: linear-gradient(135deg, #e52d27, #b31217, #702082);
            border-radius: 20px; padding: 25px 20px;
            margin-bottom: 20px; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            color: white;
        }
        .app-icon { width: 80px; height: 80px; border-radius: 20px; object-fit: cover; margin-bottom: 15px; border: 2px solid rgba(255,255,255,0.3); }
        .app-title { font-size: 18px; font-weight: 600; margin-bottom: 5px; color: white; }
        .app-desc { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 20px; }

        /* Install Button - Purple Gradient */
        .install-btn {
